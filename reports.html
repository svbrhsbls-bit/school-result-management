<style>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ezmudfrpcvjsgnjibvoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL DATA
===================================================== */

let academicYearId = null;

let classes = [];
let sections = [];
let exams = [];
let students = [];
let subjects = [];
let marks = [];

let currentClassId = "";
let currentSectionId = "";
let currentExamId = "";
let currentClassNo = "";
let currentExamCode = "";
let currentReport = "";


/* =====================================================
   HELPERS
===================================================== */

function $(id){
    return document.getElementById(id);
}

function esc(v){
    return String(v ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
}

function norm(v){
    return String(v || "")
        .trim()
        .toUpperCase()
        .replace(/[\s_-]+/g,"");
}

function selectedText(id){
    return $(id).selectedOptions[0]?.textContent || "";
}

function showMsg(text,type="success"){

    const m = $("msg");

    m.textContent = text;
    m.className = "msg " + type;
    m.style.display = "block";
}

function hideMsg(){
    $("msg").style.display = "none";
}

function classNumber(){

    const text = selectedText("classSelect");

    const m = text.match(/10|9|8/);

    return m ? m[0] : "";
}


/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);

async function init(){

    try{

        await loadAcademicYear();

        await loadClasses();

        await loadExams();

    }catch(e){

        console.error(e);

        showMsg(
            "Load Error: " + e.message,
            "error"
        );
    }
}


/* =====================================================
   ACADEMIC YEAR
===================================================== */

async function loadAcademicYear(){

    const r =
        await supabaseClient
        .from("academic_years")
        .select("id")
        .eq("is_current",true)
        .maybeSingle();

    if(r.error)
        throw r.error;

    if(r.data)
        academicYearId = r.data.id;
}


/* =====================================================
   CLASSES
===================================================== */

async function loadClasses(){

    const r =
        await supabaseClient
        .from("classes")
        .select("*")
        .order(
            "display_order",
            {
                ascending:true,
                nullsFirst:false
            }
        );

    if(r.error)
        throw r.error;

    classes = r.data || [];

    const s = $("classSelect");

    classes.forEach(c=>{

        const o =
            document.createElement("option");

        o.value = c.id;

        o.textContent =
            c.class_name ||
            c.name ||
            c.class ||
            "";

        s.appendChild(o);

    });
}


/* =====================================================
   CLASS CHANGE
===================================================== */

$("classSelect").addEventListener(
    "change",
    async function(){

        currentClassId = this.value;

        $("sectionSelect").innerHTML =
            '<option value="">ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ</option>';

        $("studentSelect").innerHTML =
            '<option value="">ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು</option>';

        if(!currentClassId)
            return;

        const r =
            await supabaseClient
            .from("sections")
            .select("*")
            .eq("class_id",currentClassId)
            .order("section_name");

        if(r.error){

            showMsg(
                "Sections load ಆಗಲಿಲ್ಲ: " +
                r.error.message,
                "error"
            );

            return;
        }

        sections = r.data || [];

        sections
        .filter(x=>x.active !== false)
        .forEach(x=>{

            const o =
                document.createElement("option");

            o.value = x.id;

            o.textContent =
                x.section_name ||
                x.name ||
                "";

            $("sectionSelect")
            .appendChild(o);

        });

    }
);


/* =====================================================
   SECTION CHANGE
===================================================== */

$("sectionSelect").addEventListener(
    "change",
    async function(){

        currentSectionId = this.value;

        $("studentSelect").innerHTML =
            '<option value="">ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು</option>';

        if(!currentClassId ||
           !currentSectionId)
            return;

        let q =
            supabaseClient
            .from("students")
            .select("*")
            .eq("class_id",currentClassId)
            .eq("section_id",currentSectionId)
            .order("student_name");

        if(academicYearId)
            q = q.eq(
                "academic_year_id",
                academicYearId
            );

        const r = await q;

        if(r.error){

            showMsg(
                "Students load ಆಗಲಿಲ್ಲ: " +
                r.error.message,
                "error"
            );

            return;
        }

        students = r.data || [];

        students.forEach(s=>{

            const o =
                document.createElement("option");

            o.value = s.id;

            o.textContent =
                s.student_name ||
                s.name ||
                "";

            $("studentSelect")
            .appendChild(o);

        });

    }
);


/* =====================================================
   EXAMS
===================================================== */

async function loadExams(){

    const r =
        await supabaseClient
        .from("exams")
        .select("*")
        .order(
            "display_order",
            {
                ascending:true,
                nullsFirst:false
            }
        );

    if(r.error)
        throw r.error;

    exams =
        (r.data || [])
        .filter(x=>x.active !== false);

    exams.forEach(e=>{

        const o =
            document.createElement("option");

        o.value = e.id;

        o.textContent =
            e.exam_name ||
            e.name ||
            e.exam_code ||
            "";

        $("examSelect")
        .appendChild(o);

    });
}


/* =====================================================
   8TH MAX MARKS
===================================================== */

function maxMarks8(code){

    code = norm(code);

    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(code)
    )
        return 10;

    if(
        ["SA1","SA2"]
        .includes(code)
    )
        return 30;

    if(
        ["TERM1","TERM2"]
        .includes(code)
    )
        return 50;

    if(code === "ANNUAL")
        return 100;

    return 100;
}


/* =====================================================
   GRADE 8
===================================================== */

function grade8(mark,max,code=""){

    mark = Number(mark);

    code = norm(code);

    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(code)
    ){

        if(mark >= 9) return "A+";
        if(mark >= 7) return "A";
        if(mark >= 5) return "B+";
        if(mark >= 3) return "B";

        return "C";
    }


    if(
        ["SA1","SA2"]
        .includes(code)
    ){

        if(mark >= 27) return "A+";
        if(mark >= 22) return "A";
        if(mark >= 16) return "B+";
        if(mark >= 10) return "B";

        return "C";
    }


    if(
        ["TERM1","TERM2","ANNUAL"]
        .includes(code)
    ){

        const p =
            Number(max)
            ? mark / Number(max) * 100
            : 0;

        if(p >= 90) return "A+";
        if(p >= 70) return "A";
        if(p >= 50) return "B+";
        if(p >= 30) return "B";

        return "C";
    }

    return "-";
}


/* =====================================================
   GRADE 9 / 10
===================================================== */

function grade910(mark,max){

    const p =
        Number(max)
        ? Number(mark) / Number(max) * 100
        : 0;

    if(p >= 90) return "A+";
    if(p >= 80) return "A";
    if(p >= 70) return "B+";
    if(p >= 60) return "B";
    if(p >= 50) return "C+";
    if(p >= 40) return "C";

    return "NA";
}


/* =====================================================
   MAX MARKS
===================================================== */

function getMaxForExam(code,sub){

    if(currentClassNo === "8")
        return maxMarks8(code);

    const n = norm(code);

    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(n)
    )
        return 50;

    if(
        ["SA1","SA2","TERM1","TERM2"]
        .includes(n)
    )
        return 80;

    return Number(
        sub?.default_maximum_marks
    ) || 100;
}


/* =====================================================
   GET GRADE
===================================================== */

function getGrade(
    mark,
    max,
    code=currentExamCode
){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    )
        return "-";

    if(currentClassNo === "8")
        return grade8(
            mark,
            max,
            code
        );

    return grade910(
        mark,
        max
    );
}


/* =====================================================
   FETCH REPORT DATA
===================================================== */

async function fetchReportData(){

    currentClassId =
        $("classSelect").value;

    currentSectionId =
        $("sectionSelect").value;

    currentExamId =
        $("examSelect").value;

    currentClassNo =
        classNumber();

    const ex =
        exams.find(
            x =>
            String(x.id) ===
            String(currentExamId)
        );

    currentExamCode =
        ex?.exam_code ||
        ex?.exam_name ||
        "";


    if(
        !currentClassId ||
        !currentSectionId ||
        !currentExamId
    ){

        showMsg(
            "ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return false;
    }


    let sq =
        supabaseClient
        .from("students")
        .select("*")
        .eq("class_id",currentClassId)
        .eq("section_id",currentSectionId)
        .order("student_name");

    if(academicYearId)
        sq = sq.eq(
            "academic_year_id",
            academicYearId
        );

    const sr = await sq;

    if(sr.error)
        throw sr.error;

    students = sr.data || [];


    const subr =
        await supabaseClient
        .from("subjects")
        .select("*")
        .eq("class_id",currentClassId)
        .order("subject_code");

    if(subr.error)
        throw subr.error;

    subjects =
        (subr.data || [])
        .filter(x=>x.active !== false);


    if(!subjects.length)
        throw new Error(
            "Subject Masterನಲ್ಲಿ subjects ಕಂಡುಬಂದಿಲ್ಲ."
        );


    marks = [];

    if(students.length){

        const mr =
            await supabaseClient
            .from("marks")
            .select("*")
            .eq("exam_id",currentExamId)
            .in(
                "student_id",
                students.map(s=>s.id)
            );

        if(mr.error)
            throw mr.error;

        marks = mr.data || [];
    }


    $("studentCount")
        .textContent = students.length;

    $("subjectCount")
        .textContent = subjects.length;

    $("examText")
        .textContent =
            ex?.exam_name ||
            ex?.exam_code ||
            "-";

    updatePassFail();

    return true;
}


/* =====================================================
   MARK FIND
===================================================== */

function markFor(
    studentId,
    subjectId,
    examId=currentExamId
){

    return marks.find(
        m =>
        String(m.student_id) === String(studentId) &&
        String(m.subject_id) === String(subjectId) &&
        String(m.exam_id) === String(examId)
    );
}


/* =====================================================
   STUDENT TOTAL
===================================================== */

function studentTotal(s){

    let total = 0;
    let max = 0;
    let has = false;

    subjects.forEach(sub=>{

        const mx =
            getMaxForExam(
                currentExamCode,
                sub
            );

        const r =
            markFor(
                s.id,
                sub.id
            );

        max += mx;

        if(
            r?.marks_obtained !== null &&
            r?.marks_obtained !== undefined &&
            r?.marks_obtained !== ""
        ){

            total +=
                Number(r.marks_obtained);

            has = true;
        }

    });

    return {
        total,
        max,
        pct:max
            ? total / max * 100
            : 0,
        has
    };
}


/* =====================================================
   PASS FAIL
===================================================== */

function updatePassFail(){

    let p = 0;
    let f = 0;

    students.forEach(s=>{

        const c =
            studentTotal(s);

        if(!c.has)
            return;

        if(c.pct >= 35)
            p++;
        else
            f++;

    });

    $("passCount").textContent = p;
    $("failCount").textContent = f;
}

/* =====================================================
   ANNUAL = TERM1 + TERM2
===================================================== */

async function annualMarksFor(
    student,
    subject
){

    const t1 =
        exams.find(
            e =>
            norm(
                e.exam_code ||
                e.exam_name
            ) === "TERM1"
        );

    const t2 =
        exams.find(
            e =>
            norm(
                e.exam_code ||
                e.exam_name
            ) === "TERM2"
        );

    let a = 0;
    let b = 0;


    if(t1){

        const r =
            await supabaseClient
            .from("marks")
            .select("marks_obtained")
            .eq("student_id",student.id)
            .eq("subject_id",subject.id)
            .eq("exam_id",t1.id)
            .maybeSingle();

        if(
            !r.error &&
            r.data?.marks_obtained != null
        )
            a =
                Number(
                    r.data.marks_obtained
                );
    }


    if(t2){

        const r =
            await supabaseClient
            .from("marks")
            .select("marks_obtained")
            .eq("student_id",student.id)
            .eq("subject_id",subject.id)
            .eq("exam_id",t2.id)
            .maybeSingle();

        if(
            !r.error &&
            r.data?.marks_obtained != null
        )
            b =
                Number(
                    r.data.marks_obtained
                );
    }


    return {
        term1:a,
        term2:b,
        annual:a+b
    };
}

/* =====================================================
   EXAM SHEET MARK
===================================================== */

async function getExamSheetMark(
    s,
    sub,
    code
){

    const ex =
        exams.find(
            e =>
            norm(
                e.exam_code ||
                e.exam_name
            ) === norm(code)
        );

    if(!ex)
        return {
            mark:"-",
            grade:"-"
        };


    if(
        norm(code) === "ANNUAL" &&
        currentClassNo === "8"
    ){

        const a =
            await annualMarksFor(
                s,
                sub
            );

        return {
            mark:a.annual,
            grade:grade8(
                a.annual,
                100,
                "ANNUAL"
            )
        };
    }


    const r =
        await supabaseClient
        .from("marks")
        .select("marks_obtained")
        .eq("student_id",s.id)
        .eq("subject_id",sub.id)
        .eq("exam_id",ex.id)
        .maybeSingle();

    if(r.error)
        return {
            mark:"-",
            grade:"-"
        };

    const max =
        getMaxForExam(
            code,
            sub
        );

    return {
        mark:
            r.data?.marks_obtained ?? "-",

        grade:
            r.data?.marks_obtained == null
            ? "-"
            : getGrade(
                r.data.marks_obtained,
                max,
                code
            )
    };
}

/* =====================================================
   CCE ROW DATA
===================================================== */

async function cceRowsForStudent(s){

    const codes = [
        "FA1",
        "FA2",
        "SA1",
        "TERM1",
        "FA3",
        "FA4",
        "SA2",
        "TERM2",
        "ANNUAL"
    ];

    const rows = [];

    for(const code of codes){

        const row = {

            code,

            vals:{},

            total:0,

            max:0,

            pct:0,

            grade:"-"

        };


        for(const sub of subjects){

            let mark = "";


            if(code === "ANNUAL"){

                const a =
                    await annualMarksFor(
                        s,
                        sub
                    );

                mark =
                    a.annual;

            }else{

                const ex =
                    exams.find(
                        e =>
                        norm(
                            e.exam_code ||
                            e.exam_name
                        ) === norm(code)
                    );

                if(ex){

                    const r =
                        await supabaseClient
                        .from("marks")
                        .select("marks_obtained")
                        .eq(
                            "student_id",
                            s.id
                        )
                        .eq(
                            "subject_id",
                            sub.id
                        )
                        .eq(
                            "exam_id",
                            ex.id
                        )
                        .maybeSingle();

                    if(
                        !r.error &&
                        r.data?.marks_obtained != null
                    ){

                        mark =
                            Number(
                                r.data.marks_obtained
                            );
                    }
                }
            }


            row.vals[sub.id] = mark;


            if(
                mark !== "" &&
                mark !== null
            ){

                row.total +=
                    Number(mark);

                row.max +=
                    getMaxForExam(
                        code,
                        sub
                    );
            }
        }


        row.pct =
            row.max
            ? row.total /
              row.max *
              100
            : 0;


        row.grade =
            currentClassNo === "8"
            ? grade8(
                row.total,
                row.max,
                code
            )
            : grade910(
                row.total,
                row.max
            );


        rows.push(row);
    }


    return rows;
}

/* =====================================================
   GENDER
===================================================== */

function genderOf(s){

    const g =
        norm(
            s.gender ||
            s.sex
        );

    return (
        g === "FEMALE" ||
        g === "F"
    )
    ? "F"
    : "M";
}


/* =====================================================
   SCHOOL SUMMARY
===================================================== */

async function getSchoolStats(){

    const out = [];

    for(
        const c of classes.filter(
            c =>
            /8|9|10/.test(
                c.class_name ||
                c.name ||
                ""
            )
        )
    ){

        let q =
            supabaseClient
            .from("students")
            .select("*")
            .eq(
                "class_id",
                c.id
            );

        if(academicYearId)
            q =
                q.eq(
                    "academic_year_id",
                    academicYearId
                );

        const r = await q;

        if(r.error)
            continue;

        const ss =
            r.data || [];


        let adM = 0;
        let adF = 0;

        ss.forEach(s=>{

            if(genderOf(s) === "M")
                adM++;
            else
                adF++;

        });


        let apM = 0;
        let apF = 0;

        let paM = 0;
        let paF = 0;

        let faM = 0;
        let faF = 0;


        for(const s of ss){

            const ex =
                exams.find(
                    e =>
                    norm(
                        e.exam_code ||
                        e.exam_name
                    ) ===
                    norm(
                        currentExamCode
                    )
                );


            if(!ex)
                continue;


            const mr =
                await supabaseClient
                .from("marks")
                .select("marks_obtained")
                .eq(
                    "student_id",
                    s.id
                )
                .eq(
                    "exam_id",
                    ex.id
                );


            const md =
                mr.data || [];


            const appeared =
                md.some(
                    x =>
                    x.marks_obtained !== null &&
                    x.marks_obtained !== ""
                );


            if(!appeared)
                continue;


            const passed =
                md.length > 0 &&
                (
                    md.reduce(
                        (a,b)=>
                        a + Number(
                            b.marks_obtained || 0
                        ),
                        0
                    )
                    /
                    (
                        md.length * 100
                    )
                    >= 0.35
                );


            if(
                genderOf(s) === "M"
            ){

                apM++;

                if(passed)
                    paM++;
                else
                    faM++;

            }else{

                apF++;

                if(passed)
                    paF++;
                else
                    faF++;
            }

        }


        out.push({

            class:
                c.class_name ||
                c.name ||
                "",

            adM,
            adF,
            adT:adM+adF,

            apM,
            apF,
            apT:apM+apF,

            paM,
            paF,
            paT:paM+paF,

            faM,
            faF,
            faT:faM+faF

        });
    }


    return out;
}

/* =====================================================
   MAKE REPORT
===================================================== */

async function makeReport(type){

    hideMsg();

    currentReport = type;

    try{

        if(
            !(await fetchReportData())
        )
            return;


        if(type === "progress")
            await renderProgress();

        else if(type === "exam")
            await renderExam();

        else if(type === "cce")
            await renderCCE();

        else if(type === "school")
            await renderSchool();

        else if(type === "subject")
            await renderSubject();


        showMsg(
            "Report ಸಿದ್ಧವಾಗಿದೆ.",
            "success"
        );


    }catch(e){

        console.error(e);

        showMsg(
            "Report load ಆಗಲಿಲ್ಲ: " +
            e.message,
            "error"
        );
    }
}

function excelDownload(){

    if(!currentReport){

        showMsg(
            "ಮೊದಲು Report ತಯಾರಿಸಿ.",
            "error"
        );

        return;
    }


    const tables =
        [
            ...$("reportArea")
            .querySelectorAll("table")
        ];


    if(!tables.length){

        showMsg(
            "Excelಗೆ data ಇಲ್ಲ.",
            "error"
        );

        return;
    }


    const wb =
        XLSX.utils.book_new();


    tables.forEach(
        (t,i)=>{

            const ws =
                XLSX.utils
                .table_to_sheet(t);

            XLSX.utils.book_append_sheet(
                wb,
                ws,
                `Report${i+1}`
            );
        }
    );


    XLSX.writeFile(
        wb,
        "School_Report.xlsx"
    );
}


/* =====================================================
   PDF DOWNLOAD
===================================================== */

async function pdfDownload(){

    if(!currentReport){

        showMsg(
            "ಮೊದಲು Report ತಯಾರಿಸಿ.",
            "error"
        );

        return;
    }


    const {jsPDF} =
        window.jspdf;


    /* CCE = A4 PORTRAIT */

    if(currentReport === "cce"){

        const pages =
            [
                ...document
                .querySelectorAll(
                    "#reportArea .cce-a4"
                )
            ];


        if(!pages.length){

            showMsg(
                "CCE Report ಸಿದ್ಧವಾಗಿಲ್ಲ.",
                "error"
            );

            return;
        }


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        for(
            let i=0;
            i<pages.length;
            i++
        ){

            const canvas =
                await html2canvas(
                    pages[i],
                    {
                        scale:2,
                        backgroundColor:"#fff",
                        useCORS:true
                    }
                );


            const img =
                canvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            if(i)
                pdf.addPage();


            pdf.addImage(
                img,
                "JPEG",
                0,
                0,
                210,
                297
            );
        }


        pdf.save(
            "CCE_Report.pdf"
        );

        return;
    }


    /* OTHER REPORTS */

    const sheets =
        [
            ...document
            .querySelectorAll(
                "#reportArea .sheet"
            )
        ];


    if(!sheets.length){

        showMsg(
            "ಮೊದಲು Report ತಯಾರಿಸಿ.",
            "error"
        );

        return;
    }


    const pdf =
        new jsPDF(
            "l",
            "mm",
            "a4"
        );


    for(
        let i=0;
        i<sheets.length;
        i++
    ){

        const canvas =
            await html2canvas(
                sheets[i],
                {
                    scale:1.5,
                    backgroundColor:"#fff",
                    useCORS:true
                }
            );


        const img =
            canvas.toDataURL(
                "image/jpeg",
                0.9
            );


        const pw =
            pdf.internal.pageSize
            .getWidth();

        const ph =
            pdf.internal.pageSize
            .getHeight();


        const ratio =
            Math.min(
                pw / canvas.width,
                ph / canvas.height
            );


        const w =
            canvas.width * ratio;

        const h =
            canvas.height * ratio;


        if(i)
            pdf.addPage();


        pdf.addImage(
            img,
            "JPEG",
            (pw-w)/2,
            4,
            w,
            h
        );
    }


    pdf.save(
        "School_Report.pdf"
    );
}

    </head>
