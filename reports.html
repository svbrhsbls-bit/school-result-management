<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports & Print</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f6fa;
    font-family:Arial,"Noto Sans Kannada",sans-serif;
    color:#222;
}

/* ================= HEADER ================= */

.top-header{
    background:#173b68;
    color:#fff;
    padding:18px;
    text-align:center;
}

.top-header h1{
    margin:0;
    font-size:24px;
}

.top-header p{
    margin:5px 0 0;
}

/* ================= MAIN ================= */

.container{
    width:97%;
    max-width:1900px;
    margin:18px auto;
}

.card{
    background:#fff;
    padding:18px;
    border-radius:12px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
    color:#173b68;
    margin-top:0;
}

/* ================= CONTROLS ================= */

.control-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

select{
    width:100%;
    padding:10px;
    border:1px solid #aaa;
    border-radius:7px;
    font-size:15px;
    background:#fff;
}

.button-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

button{
    border:0;
    border-radius:7px;
    padding:11px 15px;
    cursor:pointer;
    font-size:14px;
}

.btn-blue{
    background:#1769aa;
    color:white;
}

.btn-green{
    background:#16844a;
    color:white;
}

.btn-orange{
    background:#f0ad00;
    color:#111;
}

.btn-gray{
    background:#64748b;
    color:white;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
}

.message.error{
    background:#ffe1e5;
    color:#a00020;
}

.message.success{
    background:#dff6e8;
    color:#126b38;
}

/* ================= STATS ================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.stat{
    background:#edf5ff;
    text-align:center;
    padding:13px;
    border-radius:8px;
}

.stat strong{
    display:block;
    font-size:20px;
    color:#173b68;
    margin-top:5px;
}

/* ================= REPORT COMMON ================= */

.report-sheet{
    background:white;
    padding:20px;
    margin-bottom:15px;
    border:1px solid #aaa;
    page-break-after:always;
}

.school-heading{
    text-align:center;
}

.school-heading h1{
    margin:0;
    font-size:23px;
}

.school-heading p{
    margin:3px;
}

.school-heading h3{
    margin:9px 0;
}

.student-info{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    border:1px solid #aaa;
    padding:7px;
    margin:10px 0;
}

.student-info div{
    font-size:13px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#173b68;
    color:white;
    border:1px solid #aaa;
    padding:7px;
}

td{
    border:1px solid #aaa;
    padding:6px;
    text-align:center;
}

.left{
    text-align:left!important;
}

.small{
    font-size:10px;
}

.grade{
    font-weight:bold;
    color:#173b68;
}

/* ================= EXAM SHEET ================= */

.exam-table th,
.exam-table td{
    min-width:80px;
}

.exam-student-title{
    background:#eaf2fb;
    border:1px solid #b8c9dc;
    padding:7px;
    text-align:center;
    font-weight:bold;
    margin-top:10px;
}

.exam-mark{
    font-weight:bold;
}

.exam-grade{
    font-size:11px;
    font-weight:bold;
    color:#173b68;
    margin-top:3px;
}

/* =====================================================
   CCE REPORT
===================================================== */

.cce-a4-page{

    width:210mm;
    height:297mm;

    padding:5mm;

    margin:0 auto;

    background:#fff;

    display:grid;

    grid-template-rows:
        repeat(4,1fr);

    gap:2.5mm;

    page-break-after:always;
}

/* ---------- each student ---------- */

.cce-student{

    border:1px solid #000;

    overflow:hidden;

    page-break-inside:avoid;

    background:#fff;
}

/* ---------- school header ---------- */

.cce-header{

    text-align:center;

    border-bottom:1px solid #000;

    padding:2px;
}

.cce-header .school-name{

    font-size:11px;

    font-weight:bold;
}

.cce-header .school-address{

    font-size:7px;
}

.cce-header .report-name{

    font-size:8px;

    font-weight:bold;

    margin-top:1px;
}

/* =====================================================
   CCE TOP INFORMATION
   ವರ್ಗ COLUMN ಇಲ್ಲ
===================================================== */

.cce-top-info{

    display:grid;

    grid-template-columns:
        1fr
        1fr
        1.3fr
        1.3fr;

    border-bottom:1px solid #000;
}

.cce-top-info div{

    border-right:1px solid #000;

    padding:2px;

    text-align:center;

    font-size:7px;

    font-weight:bold;

    min-height:17px;
}

.cce-top-info div:last-child{

    border-right:0;
}

/* =====================================================
   CCE TABLE
===================================================== */

.cce-table{

    width:100%;

    table-layout:fixed;

    border-collapse:collapse;
}

.cce-table th,
.cce-table td{

    border:1px solid #000;

    padding:1px;

    font-size:5.7px;

    line-height:1;

    color:#000;

    background:#fff;
}

.cce-table th{

    background:#f3f3f3;

    font-weight:bold;
}

/* vertical columns */

.cce-vertical{

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    height:40px;

    white-space:nowrap;

    text-align:center;
}

/* SATS */

.cce-sats{

    width:25px;
}

/* STUDENT NAME */

.cce-student-name{

    width:55px;
}

/* gender */

.cce-gender{

    width:19px;
}

/* admission */

.cce-admission{

    width:25px;
}

/* subject */

.cce-subject{

    width:33px;
}

/* marks */

.cce-mark{

    width:15px;
}

/* grade */

.cce-grade{

    width:15px;
}

/* totals */

.cce-total{

    width:23px;
}

.cce-percent{

    width:27px;
}

.cce-overall-grade{

    width:25px;
}

/* part B */

.cce-partb{

    width:16px;

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    height:38px;
}

/* attendance */

.cce-attendance{

    width:29px;

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    height:38px;
}

/* result */

.cce-result{

    width:30px;

    writing-mode:vertical-rl;

    transform:rotate(180deg);

    height:38px;
}

/* TERM rows */

.cce-term-row td{

    background:#fff59d;

    font-weight:bold;
}

.cce-annual-row td{

    background:#ffe45c;

    font-weight:bold;
}

/* =====================================================
   CCE BOTTOM
   PARENTS SIGNATURE REMOVED
===================================================== */

.cce-bottom{

    display:grid;

    grid-template-columns:1fr 1fr;

    border-top:1px solid #000;
}

.cce-bottom div{

    min-height:17px;

    padding:3px;

    font-size:6.5px;

    border-right:1px solid #000;
}

.cce-bottom div:last-child{

    border-right:0;
}

/* =====================================================
   SUMMARY
===================================================== */

.summary-table{

    min-width:1100px;
}

.summary-table th{

    background:#173b68;
}

.summary-table td{

    padding:7px;
}

/* =====================================================
   PRINT
===================================================== */

@media print{

    @page{

        size:A4 portrait;

        margin:4mm;
    }

    body{

        background:white;
    }

    .no-print{

        display:none!important;
    }

    .container{

        width:100%;

        margin:0;
    }

    .report-sheet{

        border:0;

        margin:0;
    }

    .cce-a4-page{

        width:100%;

        height:289mm;

        padding:0;

        gap:2mm;

        margin:0;
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .control-grid{

        grid-template-columns:1fr 1fr;
    }

    .student-info{

        grid-template-columns:1fr 1fr;
    }

    .stats{

        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:600px){

    .control-grid{

        grid-template-columns:1fr;
    }

    .student-info{

        grid-template-columns:1fr;
    }

    .stats{

        grid-template-columns:1fr;
    }
}

</style>
</head>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ezmudfrpcvjsgnjibvoq.supabase.co";

const SUPABASE_KEY =
"sb_publishable__FYyH6NQaqgARaq2dvuovQ_rKmus0js";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let academicYearId = null;

let classes = [];
let sections = [];
let exams = [];
let students = [];
let subjects = [];
let marks = [];

let currentClassId = "";
let currentSectionId = "";
let currentExamId = "";
let currentClassNo = "";
let currentExamCode = "";

let currentReportType = "";


/* =====================================================
   HELPER
===================================================== */

function $(id){

    return document.getElementById(id);
}


function esc(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}


function norm(value){

    return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/[\s_-]+/g,"");

}


function selectedText(id){

    return $(
        id
    ).selectedOptions[0]?.textContent || "";

}


function showMessage(
    text,
    type="success"
){

    const box =
        $("message");

    box.textContent = text;

    box.className =
        "message " + type;

    box.style.display =
        "block";
}


function hideMessage(){

    $("message")
        .style.display =
        "none";
}


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    init
);


async function init(){

    try{

        await loadAcademicYear();

        await loadClasses();

        await loadExams();

    }
    catch(error){

        console.error(error);

        showMessage(
            "Load Error: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   ACADEMIC YEAR
===================================================== */

async function loadAcademicYear(){

    const result =
        await supabaseClient
        .from("academic_years")
        .select("id")
        .eq(
            "is_current",
            true
        )
        .maybeSingle();


    if(result.error)
        throw result.error;


    if(result.data)
        academicYearId =
            result.data.id;

}


/* =====================================================
   LOAD CLASSES
===================================================== */

async function loadClasses(){

    const result =
        await supabaseClient
        .from("classes")
        .select("*")
        .order(
            "display_order",
            {
                ascending:true,
                nullsFirst:false
            }
        );


    if(result.error)
        throw result.error;


    classes =
        result.data || [];


    classes.forEach(c=>{

        const option =
            document.createElement(
                "option"
            );

        option.value =
            c.id;

        option.textContent =
            c.class_name ||
            c.name ||
            c.class ||
            "";

        $("classSelect")
            .appendChild(option);

    });

}


/* =====================================================
   CLASS CHANGE
===================================================== */

$("classSelect")
.addEventListener(
    "change",
    async function(){

        currentClassId =
            this.value;

        $("sectionSelect").innerHTML =
            `
            <option value="">
                ವಿಭಾಗ ಆಯ್ಕೆ ಮಾಡಿ
            </option>
            `;

        $("studentSelect").innerHTML =
            `
            <option value="">
                ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು
            </option>
            `;


        if(!currentClassId)
            return;


        const result =
            await supabaseClient
            .from("sections")
            .select("*")
            .eq(
                "class_id",
                currentClassId
            )
            .order(
                "section_name"
            );


        if(result.error){

            showMessage(
                result.error.message,
                "error"
            );

            return;
        }


        sections =
            result.data || [];


        sections
        .filter(
            s =>
            s.active !== false
        )
        .forEach(s=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                s.id;

            option.textContent =
                s.section_name ||
                s.name ||
                "";

            $("sectionSelect")
                .appendChild(
                    option
                );

        });

    }
);


/* =====================================================
   SECTION CHANGE
===================================================== */

$("sectionSelect")
.addEventListener(
    "change",
    async function(){

        currentSectionId =
            this.value;

        $("studentSelect").innerHTML =
            `
            <option value="">
                ಎಲ್ಲಾ ವಿದ್ಯಾರ್ಥಿಗಳು
            </option>
            `;


        if(
            !currentClassId ||
            !currentSectionId
        )
            return;


        let query =
            supabaseClient
            .from("students")
            .select("*")
            .eq(
                "class_id",
                currentClassId
            )
            .eq(
                "section_id",
                currentSectionId
            )
            .order(
                "student_name"
            );


        if(academicYearId){

            query =
                query.eq(
                    "academic_year_id",
                    academicYearId
                );

        }


        const result =
            await query;


        if(result.error){

            showMessage(
                result.error.message,
                "error"
            );

            return;
        }


        students =
            result.data || [];


        students.forEach(s=>{

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                s.id;

            option.textContent =
                s.student_name ||
                s.name ||
                "";

            $("studentSelect")
                .appendChild(
                    option
                );

        });

    }
);


/* =====================================================
   LOAD EXAMS
===================================================== */

async function loadExams(){

    const result =
        await supabaseClient
        .from("exams")
        .select("*")
        .order(
            "display_order",
            {
                ascending:true,
                nullsFirst:false
            }
        );


    if(result.error)
        throw result.error;


    exams =
        (result.data || [])
        .filter(
            e =>
            e.active !== false
        );


    exams.forEach(e=>{

        const option =
            document.createElement(
                "option"
            );

        option.value =
            e.id;

        option.textContent =
            e.exam_name ||
            e.name ||
            e.exam_code ||
            "";

        $("examSelect")
            .appendChild(
                option
            );

    });

}


/* =====================================================
   CLASS NUMBER
===================================================== */

function getClassNumber(){

    const text =
        selectedText(
            "classSelect"
        );

    const found =
        text.match(
            /10|9|8/
        );

    return found
        ? found[0]
        : "";
}


/* =====================================================
   8TH MAX MARKS
===================================================== */

function maxMarks8(code){

    const c =
        norm(code);


    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(c)
    )
        return 10;


    if(
        ["SA1","SA2"]
        .includes(c)
    )
        return 30;


    if(
        ["TERM1","TERM2"]
        .includes(c)
    )
        return 50;


    if(c === "ANNUAL")
        return 100;


    return 100;
}


/* =====================================================
   GRADE 8
===================================================== */

function grade8(
    mark,
    max,
    code
){

    const m =
        Number(mark);

    const c =
        norm(code);


    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(c)
    ){

        if(m >= 9)
            return "A+";

        if(m >= 7)
            return "A";

        if(m >= 5)
            return "B+";

        if(m >= 3)
            return "B";

        return "C";
    }


    if(
        ["SA1","SA2"]
        .includes(c)
    ){

        if(m >= 27)
            return "A+";

        if(m >= 22)
            return "A";

        if(m >= 16)
            return "B+";

        if(m >= 10)
            return "B";

        return "C";
    }


    const percent =
        Number(max)
        ? m / Number(max) * 100
        : 0;


    if(percent >= 90)
        return "A+";

    if(percent >= 70)
        return "A";

    if(percent >= 50)
        return "B+";

    if(percent >= 30)
        return "B";

    return "C";
}


/* =====================================================
   GRADE 9 / 10
===================================================== */

function grade910(
    mark,
    max
){

    const percent =
        Number(max)
        ? Number(mark) /
          Number(max) *
          100
        : 0;


    if(percent >= 90)
        return "A+";

    if(percent >= 80)
        return "A";

    if(percent >= 70)
        return "B+";

    if(percent >= 60)
        return "B";

    if(percent >= 50)
        return "C+";

    if(percent >= 40)
        return "C";

    return "NA";
}


/* =====================================================
   GET MAX
===================================================== */

function getMax(
    code,
    subject
){

    if(
        currentClassNo === "8"
    ){

        return maxMarks8(
            code
        );

    }


    const c =
        norm(code);


    if(
        ["FA1","FA2","FA3","FA4"]
        .includes(c)
    )
        return 50;


    if(
        ["SA1","SA2"]
        .includes(c)
    )
        return 80;


    return Number(
        subject?.default_maximum_marks
    ) || 100;
}


/* =====================================================
   GET GRADE
===================================================== */

function getGrade(
    mark,
    max,
    code
){

    if(
        mark === "" ||
        mark === null ||
        mark === undefined
    )
        return "-";


    if(
        currentClassNo === "8"
    ){

        return grade8(
            mark,
            max,
            code
        );

    }


    return grade910(
        mark,
        max
    );
}

===================================================== */

async function fetchData(){

    currentClassId =
        $("classSelect").value;

    currentSectionId =
        $("sectionSelect").value;

    currentExamId =
        $("examSelect").value;

    currentClassNo =
        getClassNumber();


    const exam =
        exams.find(
            e =>
            String(e.id) ===
            String(currentExamId)
        );


    currentExamCode =
        exam?.exam_code ||
        exam?.exam_name ||
        "";


    if(
        !currentClassId ||
        !currentSectionId ||
        !currentExamId
    ){

        showMessage(
            "ತರಗತಿ, ವಿಭಾಗ ಮತ್ತು ಪರೀಕ್ಷೆ ಆಯ್ಕೆ ಮಾಡಿ.",
            "error"
        );

        return false;
    }


    let studentQuery =
        supabaseClient
        .from("students")
        .select("*")
        .eq(
            "class_id",
            currentClassId
        )
        .eq(
            "section_id",
            currentSectionId
        )
        .order(
            "student_name"
        );


    if(academicYearId){

        studentQuery =
            studentQuery.eq(
                "academic_year_id",
                academicYearId
            );

    }


    const sr =
        await studentQuery;


    if(sr.error)
        throw sr.error;


    students =
        sr.data || [];


    const subjectResult =
        await supabaseClient
        .from("subjects")
        .select("*")
        .eq(
            "class_id",
            currentClassId
        )
        .order(
            "subject_code"
        );


    if(subjectResult.error)
        throw subjectResult.error;


    subjects =
        (subjectResult.data || [])
        .filter(
            s =>
            s.active !== false
        );


    marks = [];


    if(students.length){

        const mr =
            await supabaseClient
            .from("marks")
            .select("*")
            .eq(
                "exam_id",
                currentExamId
            )
            .in(
                "student_id",
                students.map(
                    s=>s.id
                )
            );


        if(mr.error)
            throw mr.error;


        marks =
            mr.data || [];
    }


    $("studentCount")
        .textContent =
        students.length;


    $("subjectCount")
        .textContent =
        subjects.length;


    $("examName")
        .textContent =
        exam?.exam_name ||
        exam?.exam_code ||
        "-";


    calculatePassFail();


    return true;
}


/* =====================================================
   FIND MARK
===================================================== */

function findMark(
    studentId,
    subjectId,
    examId=currentExamId
){

    return marks.find(
        m =>
        String(m.student_id) ===
        String(studentId) &&

        String(m.subject_id) ===
        String(subjectId) &&

        String(m.exam_id) ===
        String(examId)
    );
}


/* =====================================================
   TOTAL
===================================================== */

function getStudentTotal(s){

    let total = 0;

    let max = 0;

    let entered = false;


    subjects.forEach(
        subject=>{

            const maximum =
                getMax(
                    currentExamCode,
                    subject
                );


            max += maximum;


            const row =
                findMark(
                    s.id,
                    subject.id
                );


            if(
                row?.marks_obtained !==
                null &&
                row?.marks_obtained !==
                undefined &&
                row?.marks_obtained !== ""
            ){

                total +=
                    Number(
                        row.marks_obtained
                    );

                entered = true;
            }

        }
    );


    return {

        total,

        max,

        percent:
            max
            ? total/max*100
            : 0,

        entered

    };
}


/* =====================================================
   PASS / FAIL
===================================================== */

function calculatePassFail(){

    let pass = 0;

    let fail = 0;


    students.forEach(
        s=>{

            const result =
                getStudentTotal(s);


            if(!result.entered)
                return;


            if(
                result.percent >= 35
            )
                pass++;
            else
                fail++;

        }
    );


    $("passCount")
        .textContent =
        pass;

    $("failCount")
        .textContent =
        fail;
}

/* =====================================================
   TERM MARKS
===================================================== */

async function getTermMark(
    student,
    subject,
    code
){

    const exam =
        exams.find(
            e =>
            norm(
                e.exam_code ||
                e.exam_name
            ) ===
            norm(code)
        );


    if(!exam)
        return 0;


    const result =
        await supabaseClient
        .from("marks")
        .select(
            "marks_obtained"
        )
        .eq(
            "student_id",
            student.id
        )
        .eq(
            "subject_id",
            subject.id
        )
        .eq(
            "exam_id",
            exam.id
        )
        .maybeSingle();


    if(
        result.error ||
        !result.data
    )
        return 0;


    return Number(
        result.data.marks_obtained
    ) || 0;
}


/* =====================================================
   ANNUAL = TERM 1 + TERM 2
===================================================== */

async function getAnnual(
    student,
    subject
){

    const term1 =
        await getTermMark(
            student,
            subject,
            "TERM1"
        );


    const term2 =
        await getTermMark(
            student,
            subject,
            "TERM2"
        );


    return {

        term1,

        term2,

        annual:
            term1 + term2

    };
}

/* =====================================================
   CCE STUDENT DATA
===================================================== */

async function createCCERows(
    student
){

    const codes = [

        "FA1",
        "FA2",
        "SA1",
        "TERM1",
        "FA3",
        "FA4",
        "SA2",
        "TERM2",
        "ANNUAL"

    ];


    const rows = [];


    for(
        const code
        of codes
    ){

        const row = {

            code,

            marks:{},

            total:0,

            max:0,

            percent:0,

            grade:"-"

        };


        for(
            const subject
            of subjects
        ){

            let mark = "";


            if(
                code === "ANNUAL"
            ){

                const annual =
                    await getAnnual(
                        student,
                        subject
                    );


                mark =
                    annual.annual;

            }
            else{

                mark =
                    await getTermMark(
                        student,
                        subject,
                        code
                    );

            }


            row.marks[
                subject.id
            ] = mark;


            if(
                mark !== "" &&
                mark !== null
            ){

                row.total +=
                    Number(mark);

                row.max +=
                    getMax(
                        code,
                        subject
                    );

            }

        }


        row.percent =
            row.max
            ? row.total /
              row.max *
              100
            : 0;


        row.grade =
            currentClassNo === "8"

            ? grade8(
                row.total,
                row.max,
                code
            )

            : grade910(
                row.total,
                row.max
            );


        rows.push(row);

    }


    return rows;

}

            const partBNames = [

                "ಸಾಮಾಜಿಕ",
                "ಸಂಘಟನಾ",
                "ವೈಜ್ಞಾನಿಕ",
                "ಕಲೆ",
                "ಸೃಜನಶೀಲತೆ",
                "ಮನೋಧೋರಣೆ",
                "ಮೌಲ್ಯಗಳು",
                "SUPW"

            ];


            partBNames.forEach(
                item=>{

                    html += `

                    <th rowspan="2"
                        class="cce-partb">

                        ${item}

                    </th>

                    `;

                }
            );


            html += `

            </tr>


            <tr>

            `;


            cceSubjects.forEach(
                ()=>{

                    html += `

                    <th class="cce-mark">
                        ಅಂಕ
                    </th>

                    <th class="cce-grade">
                        ಶ್ರೇಣಿ
                    </th>

                    `;

                }
            );


            html += `

            </tr>

            </thead>


            <tbody>

            `;


            rows.forEach(
                (row,index)=>{

                    const isTerm =
                        row.code === "TERM1" ||
                        row.code === "TERM2";


                    const isAnnual =
                        row.code === "ANNUAL";


                    html += `

                    <tr class="${
                        isAnnual
                        ? "cce-annual-row"
                        : isTerm
                        ? "cce-term-row"
                        : ""
                    }">

                    `;


                    if(index === 0){

                        html += `

                        <td rowspan="${rows.length}">

                            1

                        </td>


                        <td rowspan="${rows.length}"
                            class="cce-sats">

                            <div class="cce-vertical">

                                ${esc(sats)}

                            </div>

                        </td>


                        <td rowspan="${rows.length}"
                            class="cce-student-name">

                            <div class="cce-vertical">

                                ${esc(name)}

                            </div>

                        </td>


                        <td rowspan="${rows.length}"
                            class="cce-gender">

                            <div class="cce-vertical">

                                ${esc(gender)}

                            </div>

                        </td>


                        <td rowspan="${rows.length}"
                            class="cce-admission">

                            <div class="cce-vertical">

                                ${esc(admission)}

                            </div>

                        </td>

                        `;

                    }


                    cceSubjects.forEach(
                        subject=>{

                            const value =
                                row.marks[
                                    subject.id
                                ];


                            const originalSubject =
                                subjects.find(
                                    s =>
                                    String(s.id) ===
                                    String(subject.id)
                                );


                            const maximum =
                                getMax(
                                    row.code,
                                    originalSubject
                                );


                            const grade =
                                value === ""
                                ? ""
                                : getGrade(
                                    value,
                                    maximum,
                                    row.code
                                );


                            html += `

                            <td class="cce-mark">

                                ${
                                    value === ""
                                    ? ""
                                    : esc(value)
                                }

                            </td>


                            <td class="cce-grade">

                                ${
                                    grade
                                    ? esc(grade)
                                    : ""
                                }

                            </td>

                            `;

                        }
                    );


                    html += `

                    <td>

                        ${row.total}

                    </td>


                    <td>

                        ${
                            row.max
                            ? row.percent
                                .toFixed(1) +
                              "%"
                            : "0%"
                        }

                    </td>


                    <td class="grade">

                        ${esc(row.grade)}

                    </td>

                    `;


                    /* PART-B
                       A / B / C ONLY */

                    for(
                        let i=0;
                        i<8;
                        i++
                    ){

                        html += `

                        <td class="cce-partb">

                            ${
                                index ===
                                rows.length - 1
                                ? partBGrade()
                                : ""
                            }

                        </td>

                        `;

                    }


                    /* ATTENDANCE */

                    html += `

                    <td>

                        ${
                            index === 0

                            ? esc(
                                student.school_days ||
                                student.total_school_days ||
                                ""
                            )

                            : ""
                        }

                        /

                        ${
                            index === 0

                            ? esc(
                                student.attendance_days ||
                                student.present_days ||
                                ""
                            )

                            : ""
                        }

                    </td>


                    <!-- RESULT -->

                    <td>

                        ${
                            isAnnual

                            ? (
                                row.percent >= 35

                                ? "ಉತ್ತೀರ್ಣ"

                                : "ಅನುತ್ತೀರ್ಣ"
                            )

                            : ""
                        }

                    </td>


                    </tr>

                    `;

                }
            );


            html += `

            </tbody>

            </table>


            <!-- BOTTOM
                 PARENT SIGNATURE REMOVED -->

            <div class="cce-bottom">

                <div>

                    ತರಗತಿ ಶಿಕ್ಷಕರ ಸಹಿ:
                    __________________

                </div>


                <div>

                    ಮುಖ್ಯ ಶಿಕ್ಷಕರ ಸಹಿ:
                    __________________

                </div>

            </div>


            </div>

            `;
        }


        html += `

        </div>

        `;

    }


    $("reportArea")
        .innerHTML =
        html;

}

            of students
        ){

                findMark(
                    student.id,
                    subject.id
                );


            if(
                row?.marks_obtained ===
                null ||
                row?.marks_obtained ===

            const gender =

/* =====================================================
   MAKE REPORT
===================================================== */

async function makeReport(
    type
){

    hideMessage();

    currentReportType =
        type;


    try{

        const loaded =
            await fetchData();


        if(!loaded)
            return;


        if(
            type === "progress"
        ){

            await renderProgress();

        }
        else if(
            type === "exam"
        ){

            await renderExam();

        }
        else if(
            type === "cce"
        ){

            await renderCCE();

        }
        else if(
            type === "school"
        ){

            await renderSchool();

        }
        else if(
            type === "subject"
        ){

            await renderSubject();

        }


        showMessage(
            "Report ಸಿದ್ಧವಾಗಿದೆ.",
            "success"
        );

    }
    catch(error){

        console.error(error);

        showMessage(
            "Report load ಆಗಲಿಲ್ಲ: " +
            error.message,
            "error"
        );

    }

}

   EXCEL
===================================================== */

function downloadExcel(){

    if(!currentReportType){

        showMessage(
            "ಮೊದಲು Report ತಯಾರಿಸಿ.",
            "error"
        );

        return;
    }


    const tables =
        [
            ...document
            .querySelectorAll(
                "#reportArea table"
            )
        ];


    if(!tables.length){

        showMessage(
            "Excelಗೆ data ಇಲ್ಲ.",
            "error"
        );

        return;
    }


    const workbook =
        XLSX.utils.book_new();


    tables.forEach(
        (table,index)=>{

            const worksheet =
                XLSX.utils
                .table_to_sheet(
                    table
                );


            XLSX.utils.book_append_sheet(
                workbook,
                worksheet,
                "Report"+(index+1)
            );

        }
    );


    XLSX.writeFile(
        workbook,
        "School_Report.xlsx"
    );

}


/* =====================================================
   PDF
===================================================== */

async function downloadPDF(){

    if(!currentReportType){

        showMessage(
            "ಮೊದಲು Report ತಯಾರಿಸಿ.",
            "error"
        );

        return;
    }


    const {
        jsPDF
    } = window.jspdf;


    /* CCE */

    if(
        currentReportType ===
        "cce"
    ){

        const pages =
            [
                ...document
                .querySelectorAll(
                    ".cce-a4-page"
                )
            ];


        if(!pages.length){

            showMessage(
                "CCE Report ಸಿದ್ಧವಾಗಿಲ್ಲ.",
                "error"
            );

            return;
        }


        const pdf =
            new jsPDF(
                "p",
                "mm",
                "a4"
            );


        for(
            let i=0;
            i<pages.length;
            i++
        ){

            const canvas =
                await html2canvas(
                    pages[i],
                    {
                        scale:2,
                        backgroundColor:"#ffffff",
                        useCORS:true
                    }
                );


            const image =
                canvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            if(i>0)
                pdf.addPage();


            pdf.addImage(
                image,
                "JPEG",
                0,
                0,
                210,
                297
            );

        }


        pdf.save(
            "CCE_Report.pdf"
        );


        return;
    }


    /* OTHER REPORTS */

    const sheets =
        [
            ...document
            .querySelectorAll(
                "#reportArea .report-sheet"
            )
        ];


    if(!sheets.length){

        showMessage(
            "Report ಸಿದ್ಧವಾಗಿಲ್ಲ.",
            "error"
        );

        return;
    }


    const pdf =
        new jsPDF(
            "l",
            "mm",
            "a4"
        );


    for(
        let i=0;
        i<sheets.length;
        i++
    ){

        const canvas =
            await html2canvas(
                sheets[i],
                {
                    scale:1.5,
                    backgroundColor:"#ffffff",
                    useCORS:true
                }
            );


        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.9
            );


        const pageWidth =
            pdf.internal.pageSize
            .getWidth();


        const pageHeight =
            pdf.internal.pageSize
            .getHeight();


        const ratio =
            Math.min(
                pageWidth /
                canvas.width,

                pageHeight /
                canvas.height
            );


        const width =
            canvas.width *
            ratio;


        const height =
            canvas.height *
            ratio;


        if(i>0)
            pdf.addPage();


        pdf.addImage(
            image,
            "JPEG",
            (pageWidth-width)/2,
            4,
            width,
            height
        );

    }


    pdf.save(
        "School_Report.pdf"
    );

}

    <head>

        <title>

            "style"
        ).innerHTML}
